<style>
/* ============ 基础 ============ */
:root{
  --font:ui-rounded,"SF Pro Rounded","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --ink:#43356f;--ink-soft:#7c6fa6;--ink-faint:#a79ccb;
  --lav-1:#f4effe;--lav-2:#e6ddfb;--lav-3:#cfc2f5;--lav-4:#b3a1ee;--lav-5:#957fe0;--lav-6:#7b64d4;--lav-7:#5d47b0;--lav-8:#43327f;
  --milk:#fffdf8;--pink:#f4a3bd;--pink-l:#fbd7e2;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --spring:cubic-bezier(.34,1.56,.64,1);--soft:cubic-bezier(.22,1,.36,1);
  --vh:1vh;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#231a52;font-family:var(--font);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
svg{display:block}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}

#app{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:var(--sky-1);
  --sky-1:#7b64d4;--sky-2:#9983e2;--sky-3:#bcaaf0;--sky-4:#ded3fa;--floor:#fffaf0;--floor-edge:#efe3cd;
  --num-size:clamp(60px,min(27vw,calc(var(--vh)*13)),112px);--cat-size:170px}
#app[data-tod="dawn"]{--sky-1:#7f68d6;--sky-2:#a388e3;--sky-3:#dca9dd;--sky-4:#ffd9cf}
#app[data-tod="dusk"]{--sky-1:#5f47b8;--sky-2:#9370d6;--sky-3:#dc9ccd;--sky-4:#ffcdb9}
#app[data-tod="evening"]{--sky-1:#3a2c7c;--sky-2:#5d48ae;--sky-3:#8a72d4;--sky-4:#b9a6ee}
#app[data-tod="night"]{--sky-1:#1f1747;--sky-2:#33266b;--sky-3:#4d3c94;--sky-4:#6c58b8;--floor:#f1eafc;--floor-edge:#dcd0f3}

/* 电脑上打开时，放在一个手机大小的框里，方便预览 */
@media (min-width:600px) and (min-height:560px){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#4a3a8c,#1c1444)}
  #app{position:relative;width:412px;height:min(880px,calc(100vh - 48px));border-radius:46px;box-shadow:0 0 0 10px #17103a,0 40px 90px rgba(0,0,0,.5)}
}

/* ============ 天空（首页、小纸条页共用） ============ */
.sky{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 30%,var(--sky-3) 56%,var(--sky-4) 78%)}
.sky-cloud{position:absolute;height:16px;border-radius:8px;background:#fff;opacity:.2;animation:drift 70s linear infinite alternate}
.sky-cloud::after{content:"";position:absolute;left:22%;top:-11px;width:52%;height:16px;border-radius:8px;background:#fff}
.sc1{top:17%;left:-6%;width:118px}
.sc2{top:33%;right:-8%;width:150px;animation-duration:90s;animation-direction:alternate-reverse}
.sc3{top:47%;left:12%;width:88px;opacity:.14;animation-duration:80s}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(34px)}}
.sky-stars{position:absolute;top:0;left:0;right:0;height:58%;opacity:0;transition:opacity 1s ease}
.sky-stars i{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3.2s ease-in-out infinite}
#app[data-tod="night"] .sky-stars{opacity:1}
#app[data-tod="evening"] .sky-stars{opacity:.55}
#app[data-tod="night"] .sky-cloud{opacity:.08}
.sky-moon{position:absolute;top:calc(var(--sat) + 64px);left:28px;width:36px;height:36px;border-radius:50%;box-shadow:inset -10px -4px 0 0 #fff2cf;opacity:0;transform:rotate(-22deg);transition:opacity 1s ease}
#app[data-tod="night"] .sky-moon{opacity:.95}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

/* ============ 界面切换 ============ */
.screen{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease,transform .7s var(--soft),visibility 0s linear .7s}
.screen.is-active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .45s ease,transform .7s var(--soft),visibility 0s}
#home{transform:scale(1.05)}
#home.is-active{transform:none}
#notes{transform:translateY(7%)}
#notes.is-active{transform:none}

.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:rgba(67,50,127,.26);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s var(--spring)}
.icon-btn svg{width:22px;height:22px;fill:currentColor}
.icon-btn:active{transform:scale(.86)}
.mute{position:absolute;top:calc(var(--sat) + 10px);right:calc(var(--sar) + 14px);z-index:90}

/* ============ 1. 纪念日开场 ============ */
#intro{background:#2b2163}
.sea{position:absolute;top:0;left:0;width:100%;height:100%}
.sea-stars circle{animation:twinkle 3.4s ease-in-out infinite}
.sea-stars circle:nth-child(3n){animation-delay:-1.2s}
.sea-stars circle:nth-child(3n+1){animation-delay:-2.3s;animation-duration:4.2s}
.sea-cloud{animation:drift 60s linear infinite alternate}
.sea-c2,.sea-c4{animation-direction:alternate-reverse;animation-duration:80s}
.wv{animation:wave 9s linear infinite}
.wv1{--d:-52px;animation-duration:7s}
.wv2{--d:76px;animation-duration:10s}
.wv3{--d:-86px;animation-duration:12s}
.wv4{--d:114px;animation-duration:14s}
.wv5{--d:-120px;animation-duration:16s}
@keyframes wave{to{stroke-dashoffset:var(--d)}}
.sea-glint rect{transform-box:fill-box;transform-origin:center;animation:glint 2.6s ease-in-out infinite}
.sea-glint rect:nth-child(2n){animation-delay:-1.3s;animation-duration:3.1s}
.sea-glint rect:nth-child(3n){animation-delay:-.7s;animation-duration:2.2s}
@keyframes glint{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.6)}}
.sea-foam{animation:foam 5.6s ease-in-out infinite}
.sea-foam2{animation-delay:-2.4s}
@keyframes foam{0%,100%{transform:translateY(5px);opacity:.1}50%{transform:translateY(-3px);opacity:.5}}
.sea-her{transform-box:fill-box;transform-origin:62% 100%;animation:nuzzle 6s ease-in-out infinite}
@keyframes nuzzle{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2.2deg)}}

.intro-petals{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;transition:opacity 1.2s ease}
.intro-petals.is-off{opacity:0}
.intro-petals i{position:absolute;top:-24px;width:12px;height:12px;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#fff,#f9d3e2);opacity:.8;animation:petal linear infinite}
@keyframes petal{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(var(--dx),calc(var(--vh)*106)) rotate(var(--rot))}}

.intro-ui{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 54px) calc(var(--sar) + 20px) calc(var(--sab) + 14px) calc(var(--sal) + 20px)}
.intro-head{flex:none;text-align:center;color:#fff;text-shadow:0 2px 14px rgba(30,18,80,.55);opacity:0;transform:translateY(-10px)}
#intro.run .intro-head{animation:headIn 1s var(--soft) .3s both}
@keyframes headIn{to{opacity:1;transform:none}}
.ih-s{font-size:16px;font-weight:600;letter-spacing:.1em;opacity:.94}
.ih-b{display:flex;align-items:baseline;justify-content:center;font-weight:800;line-height:1.12;margin-top:2px}
.ih-num{font-size:clamp(44px,calc(var(--vh)*7.4),62px);margin:0 .12em;font-variant-numeric:tabular-nums}
.ih-unit{font-size:clamp(20px,calc(var(--vh)*3),26px);font-weight:700}
.ih-unit:empty{display:none}

.intro-stage{flex:1;min-height:0;width:100%;display:grid;grid-template:1fr/1fr;justify-items:center}
.env-zone,.letter-zone{grid-area:1/1}
.env-zone{align-self:start;display:flex;flex-direction:column;align-items:center;margin-top:calc(var(--vh)*7);transition:opacity .45s ease,transform .6s var(--soft)}
.env-zone.is-gone{opacity:0;transform:translateY(34px) scale(.84);pointer-events:none}
.env-fly{opacity:0}
#intro.run .env-fly{animation:envFly 2.8s cubic-bezier(.25,.7,.3,1) .9s both}
@keyframes envFly{
  0%{transform:translate(64vw,calc(var(--vh)*-44)) rotate(26deg) scale(.4);opacity:0}
  12%{opacity:1}
  38%{transform:translate(-14vw,calc(var(--vh)*-20)) rotate(-16deg) scale(.72)}
  68%{transform:translate(9vw,calc(var(--vh)*-5)) rotate(9deg) scale(.94)}
  100%{transform:translate(0,0) rotate(-3deg) scale(1);opacity:1}
}
.env-bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-5px) rotate(-1.2deg)}50%{transform:translateY(6px) rotate(1.4deg)}}
.env{--w:min(62vw,240px);display:block;position:relative;width:var(--w);height:calc(var(--w)*.68);filter:drop-shadow(0 16px 22px rgba(24,12,70,.42))}
.env > span{position:absolute;display:block}
.env-back{top:0;left:0;right:0;bottom:0;border-radius:16px;background:linear-gradient(180deg,#d9cbf7,#c7b6ee)}
.env-paper{left:7%;right:7%;top:9%;bottom:8%;border-radius:8px;z-index:2;background:#fffdf8 repeating-linear-gradient(180deg,transparent 0 13px,rgba(149,127,224,.2) 13px 14px);transition:transform .7s var(--spring) .28s}
.env-front{top:0;left:0;right:0;bottom:0;border-radius:16px;z-index:3;background:linear-gradient(165deg,#fffaf0 0%,#f5ecff 100%);-webkit-clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.env-front::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(149,127,224,.13);-webkit-clip-path:polygon(0 100%,50% 46%,100% 100%);clip-path:polygon(0 100%,50% 46%,100% 100%)}
.env-to{position:absolute;left:0;right:0;bottom:12%;z-index:1;text-align:center;font-size:14px;font-weight:700;color:var(--ink-soft);letter-spacing:.16em}
.env-flap{top:0;left:0;right:0;height:60%;z-index:4;border-radius:16px 16px 0 0;transform-origin:50% 0;transform:perspective(700px) rotateX(0deg);background:linear-gradient(180deg,#f8f1ff,#e9ddfc);-webkit-clip-path:polygon(0 0,100% 0,50% 100%);clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .6s var(--soft),z-index 0s linear .26s}
.env-flap::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#b9a6ee,#cdbdf5);opacity:0;transition:opacity 0s linear .26s}
.env > .env-seal{left:50%;top:60%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:5;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#b29cf0,#7b64d4 70%);box-shadow:0 3px 8px rgba(49,34,110,.4),inset 0 0 0 3px rgba(255,255,255,.22);transition:transform .45s var(--spring),opacity .3s ease}
.env-seal svg{width:22px;height:22px;fill:#fff}
.env.is-open .env-seal{transform:scale(1.7) rotate(24deg);opacity:0}
.env.is-open .env-flap{transform:perspective(700px) rotateX(180deg);z-index:1}
.env.is-open .env-flap::after{opacity:1}
.env.is-open .env-paper{transform:translateY(-56%)}
.env-hint{margin-top:22px;height:34px;line-height:34px;padding:0 16px 0 18px;border-radius:17px;background:rgba(30,18,80,.32);color:#fff;font-size:14px;font-weight:600;letter-spacing:.14em;opacity:0}
.env-zone.is-opened .env-hint{animation:none!important;opacity:0;transition:opacity .25s ease}
#intro.run .env-hint{animation:fadeIn .6s ease 3.5s both,breathe 1.9s ease-in-out 4.1s infinite}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

.letter-zone{align-self:start;width:100%;display:flex;flex-direction:column;align-items:center;margin-top:calc(var(--vh)*1.4);opacity:0;visibility:hidden;transform:translateY(calc(var(--vh)*8)) scale(.4);transform-origin:50% 30%}
.letter-zone.is-show{opacity:1;visibility:visible;transform:none;transition:transform .8s var(--spring),opacity .3s ease}
.letter{position:relative;width:min(84vw,340px);padding:20px 20px 15px;border-radius:26px;background:var(--milk);box-shadow:0 26px 50px rgba(24,12,70,.42);overflow:hidden}
.letter-lily{position:absolute;right:-28px;top:-28px;width:98px;height:98px;transform:rotate(18deg)}
.polaroid{--pw:min(54vw,calc(var(--vh)*23.5),214px);display:block;position:relative;width:var(--pw);margin:6px auto 0;padding:8px 8px 0;background:#fff;border-radius:5px;box-shadow:0 8px 18px rgba(67,50,127,.24),0 0 0 1px rgba(67,50,127,.05);transform:translateY(-18px) rotate(7deg) scale(.9);opacity:0}
.is-show .polaroid{transform:rotate(-3deg);opacity:1;transition:transform .75s var(--spring) .35s,opacity .3s ease .35s}
.is-show .polaroid.is-in{transition:transform .25s var(--spring)}
.is-show .polaroid.is-in:active{transform:rotate(-3deg) scale(.96)}
.ph{display:block;position:relative;padding-top:106%;border-radius:2px;overflow:hidden;background:var(--lav-2)}
.ph img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:var(--photo-pos,50% 30%)}
.is-show .ph img{animation:develop 2.4s ease .55s both}
@keyframes develop{0%{opacity:0;filter:brightness(1.8) saturate(.2) blur(5px)}35%{opacity:.75}100%{opacity:1;filter:none}}
.ph-empty{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13px;font-weight:600}
.ph-empty svg{width:30px;height:30px;fill:var(--lav-3);margin-bottom:6px}
.ph.is-empty img{display:none}
.ph.is-empty .ph-empty{display:flex}
.cap{display:block;height:34px;line-height:34px;text-align:center;font-size:13px;font-weight:600;color:var(--ink-soft);letter-spacing:.12em;white-space:nowrap;overflow:hidden}
.tape{position:absolute;left:50%;top:-11px;width:74px;height:22px;margin-left:-37px;transform:rotate(-5deg);border-radius:3px;background:repeating-linear-gradient(115deg,rgba(207,194,245,.94) 0 7px,rgba(230,221,251,.94) 7px 14px);box-shadow:0 1px 2px rgba(67,50,127,.15)}
.letter-text{position:relative;margin-top:16px;font-size:clamp(19px,calc(var(--vh)*2.7),22px);font-weight:700;line-height:1.7;color:var(--ink);letter-spacing:.05em;max-height:calc(var(--vh)*22);overflow-y:auto;-webkit-overflow-scrolling:touch}
.letter-sign{margin-top:8px;text-align:right;font-size:15px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em;opacity:0;transform:translateX(12px);transition:opacity .5s ease,transform .6s var(--soft)}
.letter-sign.is-in{opacity:1;transform:none}
.letter-sign svg{display:inline-block;width:14px;height:14px;fill:var(--pink);vertical-align:-2px;margin-left:5px}

/* 一个字一个字蹦出来 */
.cl{display:inline-block;white-space:nowrap}
.cl-long{display:inline;white-space:normal}
.ch{display:inline-block;white-space:pre}
.ch.is-wait{opacity:0}
.ch.is-pop{animation:chIn .34s var(--spring) both}
@keyframes chIn{from{opacity:0;transform:translateY(8px) scale(.6)}to{opacity:1;transform:none}}

.letter-btns{display:flex;align-items:center;justify-content:center;margin-top:16px;opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .4s ease,transform .6s var(--spring)}
.letter-btns.is-ready{opacity:1;transform:none;pointer-events:auto}
.btn-yes{display:inline-flex;align-items:center;height:52px;padding:0 30px;border-radius:26px;background:var(--milk);color:var(--lav-7);font-size:18px;font-weight:800;letter-spacing:.08em;box-shadow:0 5px 0 #cdbdf3,0 14px 24px rgba(24,12,70,.35);transform:scale(var(--grow,1));transition:transform .3s var(--spring),box-shadow .2s ease}
.btn-yes svg{width:18px;height:18px;margin-left:7px;fill:var(--pink)}
.btn-yes:active{transform:translateY(4px) scale(var(--grow,1));box-shadow:0 1px 0 #cdbdf3,0 6px 12px rgba(24,12,70,.3)}
.btn-no{height:40px;padding:0 16px;margin-right:16px;border-radius:20px;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);white-space:nowrap}
.btn-no.is-wobble{animation:wobble .5s ease}
@keyframes wobble{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-9deg)}45%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}}
.skip{position:absolute;top:calc(var(--sat) + 14px);left:calc(var(--sal) + 16px);z-index:5;height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:600;color:rgba(255,255,255,.88);background:rgba(30,18,80,.3)}

/* ============ 2. 首页 ============ */
#home{display:flex;flex-direction:column;padding:calc(var(--sat) + 10px) calc(var(--sar) + 18px) 0 calc(var(--sal) + 18px);overflow:hidden}
.home-top{flex:none;display:flex;align-items:center;height:42px;padding-right:52px}
.today{flex:1;color:#fff;font-size:14px;font-weight:600;letter-spacing:.08em;opacity:.94;text-shadow:0 1px 6px rgba(49,34,110,.35)}
.hero{flex:none;text-align:center;margin-top:calc(var(--vh)*3.2);color:#fff}
.hero-pre{font-size:clamp(14px,calc(var(--vh)*2.05),17px);font-weight:600;letter-spacing:.1em;text-shadow:0 1px 8px rgba(49,34,110,.4)}
.hero-num{position:relative;display:inline-flex;align-items:baseline;justify-content:center;margin-top:calc(var(--vh)*.4);padding:0 12px calc(var(--num-size)*.16);color:var(--milk);font-weight:800;line-height:1.08;cursor:pointer;transform-origin:50% 86%}
.hn-d{font-size:var(--num-size);margin:0 .07em;letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #e6dcfb,0 4px 0 #cdbff4,0 6px 0 #b09deb,0 8px 0 #937edf,0 10px 0 #7a65d0,0 22px 28px rgba(36,22,96,.5)}
.hn-s{font-size:calc(var(--num-size)*.3);font-weight:700;text-shadow:0 2px 0 rgba(93,71,176,.6),0 6px 14px rgba(36,22,96,.35)}
.hn-s:empty{display:none}
.hero-num.is-3 .hn-d{font-size:calc(var(--num-size)*.86)}
.hero-num.is-4 .hn-d{font-size:calc(var(--num-size)*.68)}
.hero-num.is-long .hn-s{font-size:calc(var(--num-size)*.2)}
.hero-num.is-jelly{animation:jelly .7s ease both}
@keyframes jelly{0%{transform:scale(1,1)}22%{transform:scale(1.13,.86)}44%{transform:scale(.93,1.08)}64%{transform:scale(1.05,.96)}82%{transform:scale(.98,1.02)}100%{transform:scale(1,1)}}
.hn-spark{position:absolute;right:-4px;top:4%;width:22px;height:22px;fill:#fff3cf;opacity:0;pointer-events:none}
.hero-num.is-secret .hn-spark{animation:sparkle 1.8s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.4) rotate(0deg)}50%{opacity:1;transform:scale(1.1) rotate(40deg)}}

.count{flex:none;align-self:center;max-width:100%;margin-top:calc(var(--vh)*2.2);padding:11px 20px 10px;border-radius:22px;text-align:center;color:#fff;background:rgba(255,255,255,.15);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.count-line{font-size:15px;font-weight:600;letter-spacing:.04em;text-shadow:0 1px 6px rgba(49,34,110,.3)}
.count-line b{font-weight:800;font-size:1.14em;margin:0 .1em;font-variant-numeric:tabular-nums}
.trail{display:flex;align-items:center;justify-content:center;height:30px;margin-top:4px}
.trail .paw{width:15px;height:15px;margin:0 3.5px;fill:rgba(255,255,255,.3);transition:fill .5s ease}
.trail .paw:nth-child(odd){transform:translateY(-3px) rotate(76deg)}
.trail .paw:nth-child(even){transform:translateY(3px) rotate(104deg)}
.trail .paw.is-on{fill:var(--milk)}
.trail-end{width:30px;height:30px;margin-left:6px;transform:scale(.82);opacity:.85;transition:transform .6s var(--spring),opacity .4s ease}
.trail.is-today .trail-end{transform:scale(1.18) rotate(14deg);opacity:1}
.count-sub{margin-top:2px;font-size:12.5px;font-weight:500;opacity:.9;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.count-sub:empty{display:none}

.yard{flex:1;min-height:0;position:relative;margin:0 calc(-1*(var(--sar) + 18px)) 0 calc(-1*(var(--sal) + 18px));--hill-h:calc(var(--sab) + 146px)}
.hill{position:absolute;left:50%;top:calc(100% - var(--hill-h));width:760px;height:760px;margin-left:-380px;border-radius:50%;background:var(--floor);box-shadow:inset 0 5px 0 rgba(255,255,255,.75),0 -10px 34px rgba(255,255,255,.22)}
.yard-sprig{position:absolute;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.ys-l{left:14px;bottom:calc(var(--hill-h) - 50px);width:54px;height:102px;--r:-9deg}
.ys-r{right:12px;bottom:calc(var(--hill-h) - 54px);width:44px;height:83px;--r:10deg;animation-delay:-2.4s}
@keyframes sway{0%,100%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) + 3deg))}}

.cat-wrap{position:absolute;left:50%;bottom:calc(var(--hill-h) - 20px);width:var(--cat-size);margin-left:calc(var(--cat-size)/-2);display:flex;flex-direction:column;align-items:center;z-index:2}
.bubble{position:relative;flex:none;width:max-content;max-width:min(76vw,290px);margin-bottom:3px;padding:9px 16px;border-radius:20px;background:var(--milk);color:var(--ink);font-size:14.5px;font-weight:600;line-height:1.45;text-align:center;white-space:pre-line;box-shadow:0 8px 18px rgba(49,34,110,.2);transform-origin:50% 100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:14px;height:14px;margin-left:-7px;background:var(--milk);border-radius:3px;transform:rotate(45deg)}
.bubble:empty{visibility:hidden}
.bubble.is-pop{animation:bubblePop .5s var(--spring) both}
@keyframes bubblePop{from{opacity:0;transform:scale(.5) translateY(10px)}to{opacity:1;transform:none}}
.cat-box{position:relative;width:100%;height:calc(var(--cat-size)*.964);cursor:pointer;touch-action:none}
.pud{position:absolute;right:calc(var(--cat-size)*-.3);bottom:calc(var(--cat-size)*.03);width:calc(var(--cat-size)*.36);height:calc(var(--cat-size)*.317);opacity:0;transform:translateY(-150px) scale(.6);pointer-events:none;transform-origin:50% 100%}
.pud svg{width:100%;height:100%}
.pud.is-in{opacity:1;transform:none;pointer-events:auto;transition:transform .7s cubic-bezier(.3,1.7,.5,1),opacity .2s ease}
.pud.is-in.is-jiggle{animation:jelly .7s ease}

/* 小猫布丁 */
.cat{width:100%;height:100%;overflow:visible}
.cat .c-shadow{fill:rgba(93,71,176,.18)}
.cat .c-all,.cat .c-tail,.cat .c-head,.cat .c-body,.cat .c-ear,.cat .c-eyes-open{transform-box:fill-box}
.cat .c-all{transform-origin:50% 100%}
.cat .c-tail{transform-origin:6% 92%;animation:tail 3.2s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(12deg)}}
.cat .c-body{transform-origin:50% 100%;animation:catBreath 3.6s ease-in-out infinite}
@keyframes catBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
.cat .c-head{transform-origin:50% 90%;animation:headBob 3.6s ease-in-out infinite}
@keyframes headBob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(1.6px) rotate(.8deg)}}
.cat .c-ear-r{transform-origin:20% 100%;animation:earTwitch 7s ease-in-out infinite}
@keyframes earTwitch{0%,90%,100%{transform:rotate(0deg)}93%{transform:rotate(9deg)}96%{transform:rotate(-3deg)}}
.cat .c-eyes-open{transform-origin:50% 50%;animation:blink 4.8s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.cat .c-eyes-happy,.cat .c-eyes-sleep,.cat .c-zzz,.cat .c-flower{display:none}
.cat.is-happy .c-eyes-open{display:none}
.cat.is-happy .c-eyes-happy{display:inline}
.cat.is-festive .c-flower{display:inline}
.cat.is-jump .c-all{animation:catJump .62s ease both}
@keyframes catJump{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(3px) scale(1.1,.86)}45%{transform:translateY(-22px) scale(.94,1.08)}68%{transform:translateY(0) scale(1.08,.92)}84%{transform:translateY(0) scale(.98,1.03)}100%{transform:translateY(0) scale(1,1)}}
.cat.is-wag .c-tail{animation-duration:.45s}
.cat.is-purr .c-all{animation:purr .16s linear infinite}
@keyframes purr{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
.cat.is-sleep .c-eyes-open,.cat.is-sleep .c-eyes-happy{display:none}
.cat.is-sleep .c-eyes-sleep,.cat.is-sleep .c-zzz{display:inline}
.cat.is-sleep .c-head{animation:sleepHead 4.6s ease-in-out infinite}
@keyframes sleepHead{0%,100%{transform:translateY(9px) rotate(-5deg)}50%{transform:translateY(11.5px) rotate(-5.6deg)}}
.cat.is-sleep .c-body{animation-duration:4.6s}
.cat.is-sleep .c-tail{animation:none;transform:rotate(16deg)}
.cat.is-sleep .c-ear-r{animation:none}
.cat .c-zzz text{opacity:0;animation:zzz 3s ease-in-out infinite}
.cat .c-zzz text:nth-child(2){animation-delay:.5s}
.cat .c-zzz text:nth-child(3){animation-delay:1s}
@keyframes zzz{0%{opacity:0;transform:translate(-6px,8px)}35%{opacity:.95}100%{opacity:0;transform:translate(8px,-12px)}}

/* 装着小纸条的口袋 */
.pocket{position:absolute;left:calc(var(--sal) + 22px);right:calc(var(--sar) + 22px);bottom:calc(var(--sab) + 16px);height:86px;display:block;text-align:left;z-index:3;transition:transform .25s var(--spring)}
.pocket:active{transform:translateY(3px) scale(.985)}
.pk-note{position:absolute;right:30px;top:-24px;width:74px;height:60px;border-radius:8px 8px 0 0;background:var(--milk);transform:rotate(5deg);box-shadow:0 -2px 10px rgba(93,71,176,.2),inset 0 0 0 1px rgba(149,127,224,.25);transition:transform .5s var(--spring)}
.pk-note i{display:block;width:46%;height:3px;border-radius:2px;background:var(--lav-3);margin:12px 0 0 11px}
.pk-note i + i{width:30%;margin-top:6px}
.pk-note svg{position:absolute;right:9px;top:8px;width:15px;height:15px;fill:var(--lav-3);transition:fill .3s ease}
.pocket.has-new .pk-note svg{fill:var(--pink);animation:heartbeat 1.3s ease-in-out infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}54%{transform:scale(1.18)}}
.pocket.has-new .pk-note{animation:peek 2.6s ease-in-out infinite}
@keyframes peek{0%,58%,100%{transform:rotate(5deg) translateY(0)}68%{transform:rotate(1deg) translateY(-12px)}78%{transform:rotate(7deg) translateY(-4px)}88%{transform:rotate(3deg) translateY(-9px)}}
.pocket.is-pull .pk-note{animation:none;transform:rotate(0deg) translateY(-64px) scale(1.15);transition:transform .42s var(--soft)}
.pk-front{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:20px 20px 34px 34px;background:linear-gradient(180deg,#a792ea,#8a73dc);box-shadow:0 6px 0 #6f58c8,0 16px 26px rgba(93,71,176,.35);display:flex;flex-direction:column;justify-content:center;padding:4px 26px 0;color:#fff}
.pk-front::before{content:"";position:absolute;top:7px;left:8px;right:8px;bottom:8px;border-radius:14px 14px 27px 27px;border:1.5px dashed rgba(255,255,255,.5);pointer-events:none}
.pk-title{font-size:19px;font-weight:800;letter-spacing:.1em}
.pk-sub{font-size:13px;font-weight:500;opacity:.94;margin-top:1px;letter-spacing:.04em}

#home.is-enter .cat-box{animation:catIn .9s var(--spring) .2s both}
@keyframes catIn{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
#home.is-enter .pocket{animation:riseIn .8s var(--soft) .1s both}
@keyframes riseIn{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
#home.is-enter .bubble{animation:bubblePop .5s var(--spring) .95s both}

/* ============ 3. 每日小纸条 ============ */
#notes{display:flex;flex-direction:column;padding-top:calc(var(--sat) + 10px)}
.n-top{flex:none;position:relative;display:flex;align-items:center;height:42px;padding:0 calc(var(--sar) + 14px) 0 calc(var(--sal) + 14px)}
.n-title{position:absolute;left:0;right:0;text-align:center;pointer-events:none;color:#fff;font-size:17px;font-weight:700;letter-spacing:.12em;text-shadow:0 1px 6px rgba(49,34,110,.35)}
.n-stage{flex:none;display:flex;flex-direction:column;align-items:center;padding:calc(var(--vh)*1) 20px calc(var(--vh)*2)}
.n-meta{color:#fff;font-size:14px;font-weight:600;letter-spacing:.1em;opacity:.94;text-shadow:0 1px 6px rgba(49,34,110,.35)}
.paper-zone{position:relative;margin-top:calc(var(--vh)*1.4);display:grid;place-items:center;--ph:clamp(58px,calc(var(--vh)*10.8),92px)}
.paper{position:relative;width:min(78vw,318px);height:calc(var(--ph)*3);filter:drop-shadow(0 14px 22px rgba(49,34,110,.28));cursor:pointer}
.pp{position:absolute;left:0;right:0;height:var(--ph);background:var(--milk)}
.pp-top{top:0;border-radius:20px 20px 0 0;transform-origin:50% 100%;z-index:3}
.pp-mid{top:calc(var(--ph) - .5px);height:calc(var(--ph) + 1px);display:grid;place-items:center;padding:0 14px;z-index:1}
.pp-bot{top:calc(var(--ph)*2);border-radius:0 0 20px 20px;transform-origin:50% 0;z-index:2}
.pp-front{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.08em}
.pp-back{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;opacity:0;background-color:#e9dffc;background-image:radial-gradient(circle,rgba(255,255,255,.8) 2.2px,transparent 2.6px);background-size:18px 18px}
.pp-top .pp-front::after,.pp-bot .pp-front::before{content:"";position:absolute;left:16px;right:16px;height:1px;background:repeating-linear-gradient(90deg,rgba(149,127,224,.4) 0 5px,transparent 5px 10px)}
.pp-top .pp-front::after{bottom:0}
.pp-bot .pp-front::before{top:0}
.pp-lily{width:40px;height:40px;flex:none}
.note-text{font-weight:700;color:var(--ink);text-align:center;line-height:1.42;letter-spacing:.05em}
.pp-text{font-size:min(var(--fs,24px),calc(var(--ph)*.31))}
.pp-seal{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;z-index:5;border-radius:50%;display:none;place-items:center;background:radial-gradient(circle at 35% 30%,#b9a4f2,#7b64d4 72%);box-shadow:0 4px 10px rgba(49,34,110,.4),inset 0 0 0 3px rgba(255,255,255,.22)}
.pp-seal svg{width:26px;height:26px;fill:#fff}
.pp-ribbon{position:absolute;left:50%;top:var(--ph);width:18px;height:var(--ph);margin-left:-9px;z-index:4;display:none;background:linear-gradient(90deg,#8a73dc,#a995ea 45%,#8a73dc);box-shadow:0 0 0 1px rgba(93,71,176,.12)}
.paper.is-sealed .pp-ribbon,.paper.is-opening .pp-ribbon{display:block}
.paper.is-opening .pp-ribbon{animation:ribbonOff .3s ease both}
@keyframes ribbonOff{to{opacity:0;transform:scaleY(.2)}}
.pz-spark{position:absolute;width:16px;height:16px;fill:#fff6d6;opacity:0;pointer-events:none}
.ps1{left:2%;top:14%}
.ps2{right:4%;top:8%;width:12px;height:12px}
.ps3{left:10%;bottom:10%;width:11px;height:11px}
.ps4{right:1%;bottom:16%;width:18px;height:18px}
.paper.is-sealed:not([hidden]) ~ .pz-spark{animation:sparkle 2.4s ease-in-out infinite}
.paper.is-sealed:not([hidden]) ~ .ps2{animation-delay:-.8s}
.paper.is-sealed:not([hidden]) ~ .ps3{animation-delay:-1.5s}
.paper.is-sealed:not([hidden]) ~ .ps4{animation-delay:-.4s}

.paper.is-sealed{animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(-4px) rotate(-1.5deg)}50%{transform:translateY(5px) rotate(1.5deg)}}
.paper.is-sealed .pp,.paper.is-opening .pp{border-radius:16px}
.paper.is-sealed .pp-top{transform:perspective(900px) rotateX(-180deg)}
.paper.is-sealed .pp-bot{transform:perspective(900px) rotateX(180deg)}
.paper.is-sealed .pp-front{opacity:0}
.paper.is-sealed .pp-back{opacity:1}
.paper.is-sealed .pp-text,.paper.is-opening .pp-text{opacity:0}
.paper.is-sealed .pp-seal,.paper.is-opening .pp-seal{display:grid}
.paper.is-sealed .pp-seal{animation:sealPulse 1.8s ease-in-out infinite}
@keyframes sealPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.paper.is-nudge{animation:wobble .5s ease}

.paper.is-opening .pp-seal{animation:sealPop .45s ease both}
@keyframes sealPop{0%{transform:scale(1);opacity:1}40%{transform:scale(1.35) rotate(-10deg);opacity:1}100%{transform:scale(1.9) rotate(20deg);opacity:0}}
.paper.is-opening .pp-top{animation:unfoldTop .72s .18s both}
.paper.is-opening .pp-bot{animation:unfoldBot .72s .62s both}
.paper.is-opening .pp-top .pp-back{animation:faceOut .72s .18s both}
.paper.is-opening .pp-top .pp-front{animation:faceIn .72s .18s both}
.paper.is-opening .pp-bot .pp-back{animation:faceOut .72s .62s both}
.paper.is-opening .pp-bot .pp-front{animation:faceIn .72s .62s both}
@keyframes unfoldTop{
  0%{transform:perspective(900px) rotateX(-180deg);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  50%{transform:perspective(900px) rotateX(-90deg);animation-timing-function:cubic-bezier(.1,.6,.3,1.5)}
  100%{transform:perspective(900px) rotateX(0deg)}
}
@keyframes unfoldBot{
  0%{transform:perspective(900px) rotateX(180deg);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  50%{transform:perspective(900px) rotateX(90deg);animation-timing-function:cubic-bezier(.1,.6,.3,1.5)}
  100%{transform:perspective(900px) rotateX(0deg)}
}
@keyframes faceIn{0%,50%{opacity:0}50.1%,100%{opacity:1}}
@keyframes faceOut{0%,50%{opacity:1}50.1%,100%{opacity:0}}
.paper.is-open{cursor:default}
.paper.is-fresh{animation:jelly .7s ease}

.n-info{display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(78vw,318px);min-height:calc(var(--ph)*3);padding:20px;border-radius:24px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);color:#fff;text-align:center}
.n-info-art{width:64px;height:64px;color:#fff;animation:bob 3.2s ease-in-out infinite}
.n-info-art svg{width:100%;height:100%}
.n-info-title{margin-top:8px;font-size:20px;font-weight:800;letter-spacing:.08em;text-shadow:0 1px 8px rgba(49,34,110,.35)}
.n-info-sub{margin-top:4px;font-size:13.5px;font-weight:500;opacity:.92;letter-spacing:.04em}
.n-hint{margin-top:calc(var(--vh)*1.6);min-height:21px;color:#fff;font-size:14px;font-weight:600;letter-spacing:.1em;text-shadow:0 1px 6px rgba(49,34,110,.35)}
.n-hint.is-breathe{animation:breathe 1.9s ease-in-out infinite}

.drawer{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--floor);border-radius:30px 30px 0 0;box-shadow:0 -10px 30px rgba(49,34,110,.18);padding:16px calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px)}
.drawer-head{flex:none;display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
.drawer-head h3{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:.08em}
.drawer-head span{font-size:12.5px;font-weight:500;color:var(--ink-soft);letter-spacing:.03em}
.grid-scroll{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;margin:0 -4px;padding:2px 4px calc(var(--sab) + 22px)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-gap:9px;gap:9px}
.g-month{grid-column:1/-1;padding:8px 2px 0;font-size:12.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.12em}
.g-month:first-child{padding-top:0}
.tile{position:relative;display:block;width:100%;height:0;padding-top:100%;border-radius:16px;background:#fff;box-shadow:0 2px 0 var(--floor-edge),inset 0 0 0 1.5px var(--lav-2);transition:transform .25s var(--spring)}
.tile:active{transform:scale(.9)}
.t-day{position:absolute;left:0;right:0;top:50%;transform:translateY(-60%);text-align:center;font-size:18px;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.t-ic{position:absolute;right:6px;bottom:6px;width:11px;height:11px;fill:var(--pink);color:var(--pink)}
.tile.is-new{background:var(--lav-1);box-shadow:0 2px 0 var(--lav-3),inset 0 0 0 1.5px var(--lav-4)}
.tile.is-new::after{content:"";position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--pink)}
.tile.is-locked{background:transparent;box-shadow:inset 0 0 0 1.5px var(--lav-2)}
.tile.is-locked .t-day{color:var(--ink-faint);opacity:.6}
.tile.is-locked .t-ic{fill:var(--ink-faint);color:var(--ink-faint);opacity:.55}
.tile.is-today{box-shadow:0 2px 0 var(--lav-4),inset 0 0 0 2.5px var(--lav-5)}
.tile.is-shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

/* ============ 浮层 ============ */
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:60;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s linear .3s}
.overlay.is-open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s ease,visibility 0s}

#viewer{display:flex;flex-direction:column;justify-content:center;background:rgba(42,30,96,.64);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.v-track{flex:none;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;padding:34px 0 30px}
.v-track::-webkit-scrollbar{display:none}
.v-card{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center}
.v-paper{position:relative;display:flex;flex-direction:column;width:min(78vw,320px);min-height:min(94vw,calc(var(--vh)*50),380px);padding:28px 24px 20px;border-radius:26px;background:var(--milk);box-shadow:0 24px 44px rgba(24,12,70,.4);overflow:hidden;--r:-1.4deg;transform:rotate(var(--r)) scale(.93);transition:transform .45s var(--spring)}
.v-card:nth-child(even) .v-paper{--r:1.4deg}
.v-card.is-cur .v-paper{transform:rotate(var(--r)) scale(1)}
.v-tape{position:absolute;left:50%;top:-8px;width:80px;height:22px;margin-left:-40px;transform:rotate(-3deg);border-radius:3px;background:repeating-linear-gradient(115deg,rgba(207,194,245,.94) 0 7px,rgba(230,221,251,.94) 7px 14px)}
.v-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink-soft);letter-spacing:.08em}
.v-mid{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 0}
.v-text{font-size:var(--fs,26px)}
.v-sign{position:relative;text-align:right;font-size:13.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em}
.v-lily{position:absolute;left:-20px;bottom:-20px;width:80px;height:80px;transform:rotate(-24deg)}
.v-bar{flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.v-arrow{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.16);transition:transform .25s var(--spring),opacity .2s ease}
.v-arrow svg{width:22px;height:22px}
.v-arrow:active{transform:scale(.86)}
.v-arrow:disabled{opacity:.3}
.v-count{min-width:96px;text-align:center;font-size:15px;font-weight:700;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.v-close{position:absolute;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 14px)}

#photoBox{z-index:70;display:grid;place-items:center;background:rgba(20,12,56,.88)}
#photoBox img{max-width:92%;max-height:86%;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:scale(.8);transition:transform .5s var(--spring)}
#photoBox.is-open img{transform:none}

#egg{z-index:75;display:grid;place-items:center;background:rgba(42,30,96,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.egg-card{width:min(80vw,320px);padding:0 22px 30px;border-radius:32px;background:var(--milk);text-align:center;box-shadow:0 26px 50px rgba(24,12,70,.45);transform:scale(.4) rotate(-8deg);transition:transform .6s var(--spring)}
#egg.is-open .egg-card{transform:none}
.egg-cat{width:132px;height:88px;margin:-52px auto 0;overflow:hidden}
.egg-cat .cat{height:auto}
.egg-text{margin-top:8px;font-size:clamp(26px,8.4vw,34px);font-weight:800;color:var(--lav-7);letter-spacing:.04em;line-height:1.3}
.egg-text span{display:inline-block;opacity:0}
#egg.is-open .egg-text span{animation:eggCh .6s var(--spring) both;animation-delay:calc(var(--i)*70ms + .25s)}
@keyframes eggCh{from{opacity:0;transform:translateY(18px) scale(.3) rotate(-14deg)}to{opacity:1;transform:none}}

.fx{position:absolute;top:0;left:0;right:0;bottom:0;z-index:95;pointer-events:none;overflow:hidden}
.fx .pt{position:absolute;display:block;will-change:transform,opacity}
.fx .pt svg{width:100%;height:100%}
.toast{position:absolute;left:50%;bottom:calc(var(--sab) + 124px);z-index:100;max-width:84%;padding:10px 18px;border-radius:20px;background:rgba(51,38,110,.94);color:#fff;font-size:14px;font-weight:600;text-align:center;white-space:pre-line;opacity:0;pointer-events:none;transform:translate(-50%,16px) scale(.9);transition:opacity .25s ease,transform .4s var(--spring)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.sim{position:absolute;left:calc(var(--sal) + 6px);bottom:calc(var(--sab) + 1px);z-index:99;padding:1px 8px;border-radius:8px;font-size:10px;font-weight:600;color:#fff;background:rgba(20,12,56,.6);pointer-events:none;white-space:nowrap}

/* 手机横过来时，提醒她竖着看 */
.rotate{position:absolute;top:0;left:0;right:0;bottom:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#7b64d4,#b3a1ee);color:#fff;font-size:17px;font-weight:700;letter-spacing:.1em}
.rotate svg{width:36px;height:36px;fill:var(--pink-l);margin-bottom:10px;animation:heartbeat 1.3s ease-in-out infinite}
@media (orientation:landscape) and (max-height:480px){.rotate{display:flex}}

/* 屏幕比较矮的手机：收紧一点 */
@media (max-height:620px){
  .hero{margin-top:calc(var(--vh)*.8)}
  .count{padding:8px 18px 7px}
  .trail{height:24px;margin-top:2px}
  .pocket{height:76px}
  .yard{--hill-h:calc(var(--sab) + 132px)}
  .pk-title{font-size:17px}
  .intro-ui{padding-top:calc(var(--sat) + 50px)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>

/* ================= 小工具 ================= */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var pad = function (n) { return (n < 10 ? '0' : '') + n; };
var clamp = function (n, a, b) { return Math.max(a, Math.min(b, n)); };
var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
var app = $('#app');

var Q = (function () {
  try { return new URLSearchParams(location.search); }
  catch (e) { return { get: function () { return null; }, has: function () { return false; } }; }
})();

function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
function reflow(el) { return el.getBoundingClientRect().width; }

/* ================= 存储（localStorage 不能用时退回内存，不报错） ================= */
var Store = (function () {
  var KEY = 'guaiguai-gift-v1', ok = false, data = {};
  try { localStorage.setItem(KEY + ':t', '1'); localStorage.removeItem(KEY + ':t'); ok = true; } catch (e) {}
  if (ok) { try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; } }
  if (typeof data !== 'object' || Array.isArray(data)) data = {};
  function save() { if (!ok) return; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  return {
    get: function (k, d) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d; },
    set: function (k, v) { data[k] = v; save(); },
    reset: function () { data = {}; if (ok) { try { localStorage.removeItem(KEY); } catch (e) {} } }
  };
})();

/* ================= 日期 =================
   全部换算成"日序号"（一个整数）再加减，不受时区和夏令时影响。 */
var D = {
  serial: function (y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / 864e5); },
  parse: function (s) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s == null ? '' : s).trim());
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    var t = new Date(Date.UTC(y, mo - 1, d));
    if (t.getUTCFullYear() !== y || t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) return null;
    return D.serial(y, mo, d);
  },
  ymd: function (n) {
    var t = new Date(n * 864e5);
    return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), w: t.getUTCDay() };
  },
  str: function (n) { var o = D.ymd(n); return o.y + '-' + pad(o.m) + '-' + pad(o.d); },
  daysInMonth: function (y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
  text: function (n) { var o = D.ymd(n); return o.m + ' 月 ' + o.d + ' 日 ' + WEEK[o.w]; }
};

/* 时钟：平时就是她手机的本地时间；网址带 ?date= / ?time= 时用来模拟 */
var Clock = (function () {
  var real = new Date(), base = new Date(real.getTime()), sim = [];
  var qd = Q.get('date'), qt = Q.get('time');
  if (qd) {
    var s = D.parse(qd);
    if (s != null) { var o = D.ymd(s); base.setFullYear(o.y, o.m - 1, o.d); sim.push(D.str(s)); }
  }
  if (qt) {
    var m = /^(\d{1,2})(?::(\d{2}))?$/.exec(qt);
    if (m && +m[1] < 24 && +(m[2] || 0) < 60) { base.setHours(+m[1], +(m[2] || 0), 0, 0); sim.push(pad(+m[1]) + ':' + pad(+(m[2] || 0))); }
  }
  var offset = base.getTime() - real.getTime();
  return {
    now: function () { return new Date(Date.now() + offset); },
    simLabel: sim.join(' ')
  };
})();
function serialOf(dt) { return D.serial(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }
function today() { return serialOf(Clock.now()); }

var START = D.parse(C.startDate);
var NOTES_START = D.parse(C.notesStartDate);
if (START == null || NOTES_START == null) {
  document.body.innerHTML = '<p style="padding:48px 28px;font:16px/1.8 sans-serif;color:#fff">CONFIG 里的 startDate 或 notesStartDate 格式不对，要写成 2026-10-24 这样。</p>';
  return;
}
var S0 = D.ymd(START);
var NOTES = Array.isArray(C.notes) ? C.notes : [];
var DAY_MS = (C.dayMilestones || []).map(Number);

/* 在一起第几天（startDate 当天 = 1） */
function dayCount(n) { return n - START + 1; }

/* 这一天是不是纪念日；是的话返回 {num, unit, label} */
function milestoneOn(n) {
  if (n <= START) return null;
  var dc = dayCount(n);
  if (DAY_MS.indexOf(dc) >= 0) return { num: dc, unit: '天', label: dc + ' 天' };
  var o = D.ymd(n);
  var months = (o.y - S0.y) * 12 + (o.m - S0.m);
  var annivDay = Math.min(S0.d, D.daysInMonth(o.y, o.m));   // 31 号在一起的话，小月按月底算
  if (months >= 1 && o.d === annivDay) {
    if (months % 12 === 0) return { num: months / 12, unit: '周年', label: (months / 12) + ' 周年' };
    return { num: months, unit: '个月', label: months + ' 个月' };
  }
  return null;
}
/* 下一个纪念日（不含今天） */
function nextMilestone(n) {
  for (var i = 1; i <= 800; i++) {
    var m = milestoneOn(n + i);
    if (m) { m.serial = n + i; m.inDays = i; return m; }
  }
  return null;
}
/* 最近一个已经到了的纪念日（含今天）；一个都没到就是在一起那天 */
function lastMilestoneSerial(n) {
  for (var s = n; s > START; s--) { if (milestoneOn(s)) return s; }
  return START;
}

    env(g, t, a, o.dur, o.vol || 0.12);

      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var t = c.currentTime + (o.t || 0);
    var src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = noiseBuf; src.loop = true;
    f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;

    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + o.dur);

  } else { x = target.x - ar.left; y = target.y - ar.top; }

  for (var i = 0; i < n; i++) {

    el.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size + 'px;margin:' + (-size / 2) + 'px 0 0 ' + (-size / 2) + 'px;opacity:0';
    el.innerHTML = '<svg viewBox="0 0 24 24" fill="' + pick(colors) + '"><use href="#i-' + pick(kinds) + '"/></svg>';
    fxLayer.appendChild(el);

    var ang = (o.dir == null ? -90 : o.dir) * Math.PI / 180 + (Math.random() - 0.5) * (o.arc == null ? 2.2 : o.arc);
    var dist = (o.spread || 90) * (0.45 + Math.random() * 0.75);
    var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, rot = (Math.random() - 0.5) * 160;
    var g = o.gravity == null ? 36 : o.gravity;
    var anim = el.animate([
      { transform: 'translate(0px,0px) scale(.2) rotate(0deg)', opacity: 0 },
      { transform: 'translate(' + dx * 0.7 + 'px,' + dy * 0.7 + 'px) scale(1.15) rotate(' + rot * 0.5 + 'deg)', opacity: 1, offset: 0.28 },
      { transform: 'translate(' + dx + 'px,' + (dy + g) + 'px) scale(.6) rotate(' + rot + 'deg)', opacity: 0 }

/* ================= 文字：一个字一个字蹦出来 =================
   空格当作一句话里的停顿；数字两边的空格不换行（"10 秒"不会被拆开）。 */
function fillText(el, text) {
  text = String(text == null ? '' : text);
  el.textContent = '';
  el.setAttribute('aria-label', text.replace(/\n/g, ' '));
  var t = text.replace(/([0-9A-Za-z]) (?=\S)/g, '$1 ').replace(/(\S) (?=[0-9A-Za-z])/g, '$1 ');
  var spans = [];
  t.split('\n').forEach(function (line, li) {
    if (li) el.appendChild(document.createElement('br'));
    line.split(' ').forEach(function (clause, ci) {
      if (!clause) return;
      if (ci) el.appendChild(document.createTextNode(' '));
      var chars = Array.from(clause);
      var cl = document.createElement('span');
      cl.className = 'cl' + (chars.length > 11 ? ' cl-long' : '');
      cl.setAttribute('aria-hidden', 'true');
      chars.forEach(function (ch) {
        var s = document.createElement('span');
        s.className = 'ch'; s.textContent = ch;
        cl.appendChild(s); spans.push(s);
      });
      el.appendChild(cl);
    });
  });
  return spans;
}
function typeIn(el, text, opt) {
  opt = opt || {};
  var spans = fillText(el, text), i = 0, done = false, timer = 0, speed = opt.speed || 80;
  spans.forEach(function (s) { s.classList.add('is-wait'); });
  function finish() {
    if (done) return; done = true; clearTimeout(timer);
    spans.forEach(function (s) { s.classList.remove('is-wait'); });
    if (opt.done) opt.done();
  }
  function step() {
    if (done) return;
    if (i >= spans.length) { finish(); return; }
    var s = spans[i++];
    s.classList.remove('is-wait'); s.classList.add('is-pop');
    timer = setTimeout(step, /[，。！？～、,.!?…]/.test(s.textContent) ? speed * 3.4 : speed);
  }
  timer = setTimeout(step, opt.delay || 0);
  return { finish: finish };
}
/* 纸条的字号：字越多越小 */

/* ================= 返回键：安卓按返回先关浮层、再回首页，而不是直接退出 ================= */
var layers = [], navBusy = false;
function pushLayer(close) {
  layers.push(close);
  try { history.pushState({ d: layers.length }, ''); } catch (e) {}
}
function popLayer() {
  if (!layers.length || navBusy) return;
  var viaHistory = false;
  try { viaHistory = !!(history.state && history.state.d === layers.length); } catch (e) {}
  if (viaHistory) {
    navBusy = true;
    setTimeout(function () { navBusy = false; }, 500);
    history.back();
  } else { layers.pop()(); }
}
window.addEventListener('popstate', function () {
  navBusy = false;
  var want = 0;
  try { want = (history.state && history.state.d) || 0; } catch (e) {}
  while (layers.length > want) layers.pop()();
  if (want > layers.length) { try { history.replaceState({ d: layers.length }, ''); } catch (e) {} }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') popLayer(); });

  var r = (C.cat && C.cat.sleepHours) || [23, 5], a = r[0], b = r[1];
  return a > b ? (h >= a || h < b) : (h >= a && h < b);

var catBox = $('#catBox'), bubble = $('#bubble'), pud = $('#pud');
catBox.innerHTML = catSVG('cat');
var cat = $('#cat');
var catState = { sleeping: false, tapLine: 0, streak: 0, lastTap: 0, sleepTaps: 0, happyTimer: 0, wagTimer: 0, purrTimer: 0, drag: null };

function say(text, pop) {
  bubble.textContent = text || '';
  if (pop === false) return;
  bubble.classList.remove('is-pop'); reflow(bubble); bubble.classList.add('is-pop');
}
function catHappy(ms) {
  cat.classList.add('is-happy');
  clearTimeout(catState.happyTimer);
  catState.happyTimer = setTimeout(function () { cat.classList.remove('is-happy'); }, ms || 900);
}
function catJump() { cat.classList.remove('is-jump'); reflow(cat); cat.classList.add('is-jump'); }
function setCatSleep(v) {
  if (catState.sleeping === v) return;
  catState.sleeping = v;
  cat.classList.toggle('is-sleep', v);
  catState.sleepTaps = 0;
}
function tapCat() {
  var now = Date.now();
  clearTimeout(home.bubbleTimer);
  if (catState.sleeping) {
    catState.sleepTaps++;
    if (catState.sleepTaps % 5 === 0) {              // 连点 5 下：迷迷糊糊醒一下，催她去睡
      cat.classList.remove('is-sleep');
      say(C.cat.sleepWake); Sound.play('meow', 0.82);
      setTimeout(function () { if (catState.sleeping) { cat.classList.add('is-sleep'); say(C.cat.sleep); } }, 3400);
    } else {
      var lines = C.cat.sleepTap || [];
      say(lines[(catState.sleepTaps - 1) % (lines.length || 1)] || '');
      Sound.play('purr');
      burst(catBox, { n: 3, kinds: ['spark'], colors: ['#ffffff', '#e6ddfb'], ay: 0.25, spread: 50, size: 14 });
    }
    return;
  }
  catState.streak = (now - catState.lastTap < 1600) ? catState.streak + 1 : 1;
  catState.lastTap = now;
  catJump(); catHappy(900);
  cat.classList.add('is-wag');
  clearTimeout(catState.wagTimer);
  catState.wagTimer = setTimeout(function () { cat.classList.remove('is-wag'); }, 900);
  Sound.play('meow'); vibrate(8);
  burst(catBox, { n: 5, ay: 0.25, spread: 70 });
  if (catState.streak >= 10) {                        // 彩蛋：连点 10 下，布丁请她吃布丁
    catState.streak = 0;
    pud.classList.add('is-in');
    say(C.cat.pudding);
    setTimeout(function () { Sound.play('boing'); burst(pud, { n: 6, kinds: ['spark'], colors: ['#ffe08f', '#ffffff', '#f4a3bd'], spread: 60, size: 14 }); }, 420);
    return;
  }
  var tl = C.cat.tap || ['喵～'];
  say(tl[catState.tapLine++ % tl.length]);
}
function petCat() {                                   // 来回摸它：咕噜咕噜
  clearTimeout(home.bubbleTimer);
  if (catState.sleeping) { Sound.play('purr'); return; }
  cat.classList.add('is-purr', 'is-happy');
  clearTimeout(catState.happyTimer); clearTimeout(catState.purrTimer);
  say(C.cat.pet); Sound.play('purr');
  burst(catBox, { n: 7, ay: 0.3, spread: 80, stagger: 700 });
  catState.purrTimer = setTimeout(function () { cat.classList.remove('is-purr', 'is-happy'); }, 1700);
}
catBox.addEventListener('pointerdown', function (e) {
  catState.drag = { x: e.clientX, y: e.clientY, dist: 0, petted: false };
  try { catBox.setPointerCapture(e.pointerId); } catch (err) {}
});
catBox.addEventListener('pointermove', function (e) {
  var d = catState.drag; if (!d) return;
  d.dist += Math.abs(e.clientX - d.x) + Math.abs(e.clientY - d.y);
  d.x = e.clientX; d.y = e.clientY;
  if (d.dist > 110 && !d.petted) { d.petted = true; petCat(); }
});
catBox.addEventListener('pointerup', function () {
  var d = catState.drag; catState.drag = null;
  if (d && d.dist < 14) tapCat();
});
catBox.addEventListener('pointercancel', function () { catState.drag = null; });
catBox.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapCat(); } });
pud.addEventListener('click', function () {
  pud.classList.remove('is-jiggle'); reflow(pud); pud.classList.add('is-jiggle');
  Sound.play('boing');
});

/* ================= 首页 ================= */
var heroNum = $('#heroNum'), heroDigits = $('#heroDigits'), trail = $('#trail');
var home = { serial: 0, ticker: false, hour: -1, countTimer: 0, bubbleTimer: 0, num: 0 };
var TRAIL_N = 8;

(function buildTrail() {
  var html = '';
  for (var i = 0; i < TRAIL_N; i++) html += '<svg class="paw" viewBox="0 0 24 24"><use href="#i-paw"/></svg>';
  trail.innerHTML = html + '<svg class="trail-end"><use href="#lily"/></svg>';
})();

function renderHome() {
  var now = Clock.now(), n = serialOf(now), o = D.ymd(n), dc = dayCount(n), h = now.getHours();
  home.serial = n; home.hour = h;
  $('#todayChip').textContent = o.m + ' 月 ' + o.d + ' 日 ' + WEEK[o.w];
  applyTod(h);

  var a, b, num;
  if (dc >= 1) { $('#heroPre').textContent = greetWord(h) + C.herName + '，我们在一起'; a = '第'; num = dc; b = '天'; }
  else { $('#heroPre').textContent = greetWord(h) + C.herName + '，再等'; a = ''; num = START - n; b = '天就在一起啦'; }
  $('#heroA').textContent = a; $('#heroB').textContent = b;
  heroDigits.textContent = num; home.num = num;
  var len = String(num).length;
  heroNum.classList.toggle('is-3', len === 3);
  heroNum.classList.toggle('is-4', len >= 4);
  heroNum.classList.toggle('is-long', b.length > 2);
  heroNum.classList.toggle('is-secret', (C.secretDays || []).indexOf(dc) >= 0);
  heroNum.setAttribute('aria-label', a + num + b);

  renderCount(n);
  renderPocket();
  setCatSleep(isSleepHour(h));
  cat.classList.toggle('is-festive', !!milestoneOn(n));
}

function renderCount(n) {
  var ms = milestoneOn(n), next = nextMilestone(n), line = $('#countLine'), sub = $('#countSub');
  var on = 0;
  home.ticker = false;
  if (ms) {
    line.innerHTML = '今天是 <b>' + ms.label + '</b> 纪念日';
    sub.textContent = next ? '下一个是 ' + next.label + '，还有 ' + next.inDays + ' 天' : '';
    on = TRAIL_N;
  } else if (next) {
    var prev = lastMilestoneSerial(n);
    on = clamp(Math.round((n - prev) / (next.serial - prev) * TRAIL_N), 0, TRAIL_N - 1);
    if (next.inDays === 1) {
      line.innerHTML = '明天就是 <b>' + next.label + '</b> 纪念日啦';
      home.ticker = true; updateTicker(Clock.now());
    } else {
      line.innerHTML = '离 <b>' + next.label + '</b> 纪念日还有 <b>' + next.inDays + '</b> 天';
      sub.textContent = D.text(next.serial);
    }
  } else { line.textContent = ''; sub.textContent = ''; }
  trail.classList.toggle('is-today', !!ms);
  $$('.paw', trail).forEach(function (p, i) { p.classList.toggle('is-on', i < on); });
}
function updateTicker(now) {
  var end = new Date(now.getTime()); end.setHours(24, 0, 0, 0);
  var s = Math.max(0, Math.round((end - now) / 1000));
  $('#countSub').textContent = '还有 ' + pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
}

function noteInfo() {
  var n = today(), idx = n - NOTES_START + 1, total = NOTES.length;
  return { n: n, idx: idx, total: total, started: idx >= 1, exhausted: idx > total, unlocked: clamp(idx, 0, total), hasToday: idx >= 1 && idx <= total };
}
var readSet = {};
(Store.get('read', []) || []).forEach(function (i) { readSet[i] = true; });
function isRead(i) { return !!readSet[i]; }
function markRead(i) {
  if (readSet[i]) return;
  readSet[i] = true;
  Store.set('read', Object.keys(readSet).map(Number).sort(function (a, b) { return a - b; }));
}

function renderPocket() {
  var st = noteInfo(), pocket = $('#btnNotes'), sub = $('#pkSub'), fresh = false;
  if (!st.started) { var o = D.ymd(NOTES_START); sub.textContent = '第一张 ' + o.m + ' 月 ' + o.d + ' 日送到'; }
  else if (st.exhausted) sub.textContent = C.notesEmpty;
  else if (!isRead(st.idx)) { sub.textContent = '有一张新的，快来拆'; fresh = true; }
  else sub.textContent = '今天的拆过啦，来翻翻以前的';
  pocket.classList.toggle('has-new', fresh);
}

function fitHome() {
  var yard = $('#yard'), pocket = $('#btnNotes');
  if (!yard.clientHeight) return;
  var avail = pocket.offsetTop - 26 - 6;                       // 布丁脚下到院子顶端的距离
  var size = clamp((avail - 62) / 0.964, 96, 232);
  size = Math.min(size, app.clientWidth * 0.57);
  app.style.setProperty('--cat-size', Math.round(size) + 'px');
}

function countUp(to) {
  cancelAnimationFrame(home.countTimer);
  var from = Math.max(0, to - Math.min(to, 16)), t0 = performance.now(), dur = 900;
  function frame(t) {
    var p = clamp((t - t0) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
    heroDigits.textContent = Math.round(from + (to - from) * e);
    if (p < 1) home.countTimer = requestAnimationFrame(frame);
    else { heroDigits.textContent = to; jelly(heroNum); }
  }
  home.countTimer = requestAnimationFrame(frame);
}
function jelly(el) { el.classList.remove('is-jelly'); reflow(el); el.classList.add('is-jelly'); }

function enterHome(fresh) {
  renderHome();
  show('home');
  fitHome();
  var st = noteInfo(), h = Clock.now().getHours(), ms = milestoneOn(st.n);
  clearTimeout(home.bubbleTimer);
  if (catState.sleeping) say(C.cat.sleep, false);
  else if (ms) say(C.cat.anniversary, false);
  else {
    var g = C.cat.greet || {};
    var list = h < 11 ? g.morning : h < 14 ? g.noon : h < 18 ? g.afternoon : g.evening;
    say(pick(list && list.length ? list : ['喵～']), false);
    if (st.hasToday && !isRead(st.idx)) home.bubbleTimer = setTimeout(function () { if (current === 'home' && !catState.sleeping) say(C.cat.newNote); }, 4200);
  }
  if (fresh) {
    var el = $('#home');
    el.classList.remove('is-enter'); reflow(el); el.classList.add('is-enter');
    setTimeout(function () { el.classList.remove('is-enter'); }, 1700);
    countUp(home.num);
  }
}

/* 每秒走一下：过了零点自动刷新；整点换天色；纪念日前一天倒计时到秒 */
function tick() {
  var now = Clock.now();
  if (serialOf(now) !== home.serial && home.serial) { location.reload(); return; }
  if (now.getHours() !== home.hour) {
    home.hour = now.getHours();
    applyTod(home.hour);
    var sl = isSleepHour(home.hour);
    if (sl !== catState.sleeping) { setCatSleep(sl); if (current === 'home') say(sl ? C.cat.sleep : pick((C.cat.greet || {}).morning || ['喵～'])); }
  }
  if (home.ticker) updateTicker(now);
}

/* —— 彩蛋：连点三下大数字（第 69、78 天点一下就行） —— */
var secretTaps = [];
function hitNumber() {
  var t = performance.now();
  secretTaps = secretTaps.filter(function (x) { return t - x < 700; });
  secretTaps.push(t);
  jelly(heroNum); Sound.play('boing');
  if (!C.secret) return;

heroNum.addEventListener('click', hitNumber);
heroNum.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hitNumber(); } });

var eggEl = $('#egg');
$('#eggCat').innerHTML = catSVG('eggcat');
$('#eggcat').classList.add('is-happy');
function showEgg() {

/* ================= 每日小纸条 ================= */
var paper = $('#paper'), ppText = $('#ppText'), nHint = $('#nHint'), grid = $('#grid');
var notesBusy = false, notesToken = 0;

function setHint(text, breathe) { nHint.textContent = text || ''; nHint.classList.toggle('is-breathe', !!breathe); }

function renderNotes() {
  var st = noteInfo(), info = $('#nInfo');
  notesToken++; notesBusy = false;
  $('#nMeta').textContent = D.text(st.n);
  $('#ppTo').textContent = '给' + C.herName;
  $('#ppSign').textContent = '—— ' + C.signature;
  paper.classList.remove('is-opening', 'is-fresh', 'is-nudge');
  if (!st.hasToday) {
    paper.hidden = true; info.hidden = false;
    $('#nInfoArt').innerHTML = '<svg><use href="#i-env"/></svg>';
    if (!st.started) {
      var o = D.ymd(NOTES_START), left = NOTES_START - st.n;
      $('#nInfoTitle').textContent = '第一张还在路上';
      $('#nInfoSub').textContent = o.m + ' 月 ' + o.d + ' 日送到，再等 ' + left + ' 天';
    } else {
      $('#nInfoTitle').textContent = C.notesEmpty;
      $('#nInfoSub').textContent = '以前的都在下面，想看哪张翻哪张';
    }
    setHint('');
  } else {
    paper.hidden = false; info.hidden = true;
    $('#ppNo').textContent = '第 ' + st.idx + ' 张';
    var text = NOTES[st.idx - 1];

    if (isRead(st.idx)) {
      paper.classList.remove('is-sealed'); paper.classList.add('is-open');

      paper.classList.remove('is-open'); paper.classList.add('is-sealed');
      paper.setAttribute('aria-label', '拆开今天的纸条');
      setHint('点一下，拆开今天的纸条', true);
    }
  }
  renderGrid();
}

function renderGrid() {
  var st = noteInfo(), html = '', lastM = null, firstY = D.ymd(NOTES_START).y, readN = 0;
  for (var i = 1; i <= st.total; i++) {
    var s = NOTES_START + i - 1, o = D.ymd(s);
    if (o.m !== lastM) {
      html += '<div class="g-month">' + (o.y !== firstY && (lastM === null || o.m === 1) ? o.y + ' 年 ' : '') + o.m + ' 月</div>';
      lastM = o.m;
    }
    var state = i > st.unlocked ? 'locked' : isRead(i) ? 'read' : 'new';
    if (state === 'read') readN++;
    html += '<button type="button" class="tile is-' + state + (i === st.idx ? ' is-today' : '') + '" data-i="' + i + '" aria-label="' + o.m + ' 月 ' + o.d + ' 日' + (state === 'locked' ? '，还没到' : state === 'new' ? '，还没拆' : '') + '">' +
      '<span class="t-day">' + o.d + '</span>' +
      (state === 'locked' ? '<svg class="t-ic"><use href="#i-lock"/></svg>' : state === 'read' ? '<svg class="t-ic"><use href="#i-heart"/></svg>' : '') +
      '</button>';
  }
  grid.innerHTML = html;
  $('#drawerCount').textContent = st.unlocked ? '拆了 ' + readN + ' 张，一共 ' + st.total + ' 张' : '一共 ' + st.total + ' 张';

function scrollGridToToday() {

function openTodayNote() {
  var st = noteInfo();

  var token = notesToken, text = NOTES[st.idx - 1];

  setTimeout(function () { if (alive()) Sound.play('rustle'); }, 300);
  setTimeout(function () { if (alive()) Sound.play('rustle'); }, 740);
  setTimeout(function () {

paper.addEventListener('click', openTodayNote);
paper.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openTodayNote(); } });

grid.addEventListener('click', function (e) {

    show('notes');
    scrollGridToToday();
    pushLayer(function () { show('home'); renderPocket(); fitHome(); });
    setTimeout(function () { pocket.classList.remove('is-pull'); }, 500);
  }, 240);
}
$('#btnNotes').addEventListener('click', openNotes);
$('#btnBack').addEventListener('click', function () { Sound.play('tap'); popLayer(); });

/* —— 翻看收藏：左右滑着翻 —— */
var viewer = $('#viewer'), vTrack = $('#vTrack');
var view = { list: [], cur: -1, raf: 0 };

function openViewer(i) {
  var st = noteInfo(), html = '';
  view.list = [];
  for (var k = 1; k <= st.unlocked; k++) { if (k === st.idx && !isRead(k)) continue; view.list.push(k); }
  if (!view.list.length) return;
  view.list.forEach(function (k) {
    var s = NOTES_START + k - 1;
    html += '<div class="v-card" data-i="' + k + '"><div class="v-paper">' +
      '<span class="v-tape"></span>' +
      '<svg class="v-lily" aria-hidden="true"><use href="#lily"/></svg>' +
      '<div class="v-head"><span>第 ' + k + ' 张</span><span>' + D.text(s) + '</span></div>' +
      '<div class="v-mid"><p class="v-text note-text"></p></div>' +
      '<div class="v-sign"></div>' +
      '</div></div>';
  });
  vTrack.innerHTML = html;
  $$('.v-card', vTrack).forEach(function (card) {
    var k = +card.getAttribute('data-i'), p = $('.v-text', card), text = NOTES[k - 1];
    p.style.setProperty('--fs', (noteFontSize(text) + 2) + 'px');
    fillText(p, text);
    $('.v-sign', card).textContent = '—— ' + C.signature;
  });
  viewer.classList.add('is-open'); viewer.setAttribute('aria-hidden', 'false');
  var pos = Math.max(0, view.list.indexOf(i));
  view.cur = -1;
  vTrack.scrollLeft = pos * vTrack.clientWidth;
  syncViewer(true);
  pushLayer(closeViewer);
}
function closeViewer() {
  viewer.classList.remove('is-open'); viewer.setAttribute('aria-hidden', 'true');
  renderGrid(); renderPocket();
}
function syncViewer(silent) {
  var w = vTrack.clientWidth || 1;
  var pos = clamp(Math.round(vTrack.scrollLeft / w), 0, view.list.length - 1);
  if (pos === view.cur) return;
  view.cur = pos;
  var k = view.list[pos];
  $$('.v-card', vTrack).forEach(function (c, idx) { c.classList.toggle('is-cur', idx === pos); });
  $('#vCount').textContent = (pos + 1) + ' / ' + view.list.length;
  $('#vPrev').disabled = pos === 0;
  $('#vNext').disabled = pos === view.list.length - 1;
  markRead(k);
  if (!silent) Sound.play('flip');
}
vTrack.addEventListener('scroll', function () {
  cancelAnimationFrame(view.raf);
  view.raf = requestAnimationFrame(function () { syncViewer(false); });
}, { passive: true });
function viewerGo(step) {
  var pos = clamp(view.cur + step, 0, view.list.length - 1), left = pos * vTrack.clientWidth;
  try { vTrack.scrollTo({ left: left, behavior: 'smooth' }); } catch (e) { vTrack.scrollLeft = left; }
}
$('#vPrev').addEventListener('click', function (e) { e.stopPropagation(); viewerGo(-1); });
$('#vNext').addEventListener('click', function (e) { e.stopPropagation(); viewerGo(1); });
$('#vClose').addEventListener('click', function (e) { e.stopPropagation(); Sound.play('tap'); popLayer(); });
viewer.addEventListener('click', function (e) {
  if (e.target.closest && (e.target.closest('.v-paper') || e.target.closest('.v-bar'))) return;
  popLayer();
});

/* ================= 1. 纪念日开场 ================= */
var introEl = $('#intro'), envEl = $('#env'), envZone = $('#envZone'), letterZone = $('#letterZone');
var letterBtns = $('#letterBtns'), btnYes = $('#btnYes'), btnNo = $('#btnNo'), polaroid = $('#polaroid');
var photoEl = $('#photo'), phBox = photoEl.parentNode, letterText = $('#letterText'), letterSign = $('#letterSign');
var intro = { ctx: null, opened: false, typer: null, noIdx: 0, grow: 1, timers: [], playing: false };

function letterFor(serial) {
  var base = C.letter || {}, extra = (C.letters || {})[D.str(serial)] || {}, out = {}, k;
  for (k in base) out[k] = base[k];
  for (k in extra) out[k] = extra[k];
  return out;
}
/* 开场上面那行字 + 用哪封信 */
function introContext(n) {
  var ms = milestoneOn(n);
  if (ms) return { small: '今天是我们在一起', pre: '', num: ms.num, unit: ms.unit, letter: letterFor(n) };
  var dc = dayCount(n);
  if (dc < 1) return { small: '我们的故事', pre: '还有', num: START - n, unit: '天开始', letter: letterFor(START) };
  return { small: '今天是我们在一起的', pre: '第', num: dc, unit: '天', letter: letterFor(lastMilestoneSerial(n)) };
}
function photoSrc(L) { return (L && L.photo) || C.photo || window.EMBEDDED_PHOTO || ''; }

photoEl.addEventListener('error', function () { phBox.classList.add('is-empty'); });
photoEl.addEventListener('load', function () { phBox.classList.remove('is-empty'); });

function spawnPetals() {
  var box = $('#introPetals'), html = '';
  for (var i = 0; i < 6; i++) {
    html += '<i style="left:' + (8 + Math.random() * 84).toFixed(1) + '%;--dx:' + Math.round((Math.random() - 0.3) * 160) + 'px;--rot:' + Math.round(200 + Math.random() * 400) + 'deg;animation-duration:' + (11 + Math.random() * 8).toFixed(1) + 's;animation-delay:' + (-Math.random() * 14).toFixed(1) + 's"></i>';
  }
  box.innerHTML = html;
  box.classList.remove('is-off');
}
function later(fn, ms) { intro.timers.push(setTimeout(fn, ms)); }

function playIntro(ctx) {
  intro.timers.forEach(clearTimeout);
  intro = { ctx: ctx, opened: false, typer: null, noIdx: 0, grow: 1, timers: [], playing: true };
  var L = ctx.letter;
  $('#ihSmall').textContent = ctx.small;
  $('#ihPre').textContent = ctx.pre || '';
  $('#ihNum').textContent = ctx.num;
  $('#ihUnit').textContent = ctx.unit;
  $('#envTo').textContent = C.herName + ' 亲启';
  $('#photoCap').textContent = L.photoCaption || '';
  var src = photoSrc(L);
  phBox.classList.toggle('is-empty', !src);
  if (src && photoEl.getAttribute('src') !== src) photoEl.setAttribute('src', src);
  fillText(letterText, L.text || '').forEach(function (s) { s.classList.add('is-wait'); });
  letterSign.innerHTML = '';
  letterSign.appendChild(document.createTextNode(L.signature || C.signature || ''));
  letterSign.insertAdjacentHTML('beforeend', '<svg aria-hidden="true"><use href="#i-heart"/></svg>');
  letterSign.classList.remove('is-in');
  $('#btnYesText').textContent = L.yes || '进去看看';
  var noList = L.no || [];
  btnNo.hidden = !noList.length;
  btnNo.textContent = noList[0] || '';
  btnYes.style.setProperty('--grow', 1);

  envEl.classList.remove('is-open');
  envZone.classList.remove('is-gone', 'is-opened');
  letterZone.classList.remove('is-show');
  letterBtns.classList.remove('is-ready');
  polaroid.classList.remove('is-in');
  introEl.classList.remove('run');
  spawnPetals();
  show('intro');
  reflow(introEl);
  introEl.classList.add('run');
}
function markIntroSeen() {
  Store.set('visited', true);
  var seen = Store.get('introSeen', {}) || {};
  seen[D.str(today())] = 1;
  Store.set('introSeen', seen);
}
function openLetter() {
  if (intro.opened || !intro.playing) return;
  intro.opened = true;
  markIntroSeen();
  Sound.play('rustle'); vibrate(10);
  envEl.classList.add('is-open');
  envZone.classList.add('is-opened');
  burst(envEl, { n: 9, kinds: ['spark'], colors: ['#ffffff', '#fff2d2', '#e6ddfb'], ay: 0.6, spread: 90, size: 16 });
  $('#introPetals').classList.add('is-off');
  later(function () { Sound.play('chime'); }, 380);
  later(function () {
    envZone.classList.add('is-gone');
    letterZone.classList.add('is-show');
    later(function () { intro.typer = typeIn(letterText, intro.ctx.letter.text || '', { speed: 95, done: letterDone }); }, 950);
    later(function () { polaroid.classList.add('is-in'); }, 1300);
  }, 980);
}
function letterDone() {
  letterSign.classList.add('is-in');
  later(function () { letterBtns.classList.add('is-ready'); }, 450);
}
function finishIntro(fancy) {
  if (!intro.playing) return;
  intro.playing = false;
  intro.timers.forEach(clearTimeout);
  if (intro.typer) intro.typer.finish();
  markIntroSeen();
  if (fancy) { Sound.play('pop'); burst(btnYes, { n: 16, spread: 140, arc: 3, size: 20 }); }
  enterHome(true);
  setTimeout(function () { introEl.classList.remove('run'); $('#introPetals').innerHTML = ''; }, 800);
}
envEl.addEventListener('click', openLetter);
$('#letter').addEventListener('click', function (e) {
  if (e.target.closest && e.target.closest('.polaroid')) return;
  if (intro.typer) intro.typer.finish();
});
btnYes.addEventListener('click', function () { finishIntro(true); });
btnNo.addEventListener('click', function () {
  var list = (intro.ctx && intro.ctx.letter.no) || [];
  intro.noIdx++;
  if (intro.noIdx >= list.length) { finishIntro(true); return; }
  Sound.play('boing');
  btnNo.textContent = list[intro.noIdx];
  btnNo.classList.remove('is-wobble'); reflow(btnNo); btnNo.classList.add('is-wobble');
  intro.grow = Math.min(1.24, intro.grow + 0.08);
  btnYes.style.setProperty('--grow', intro.grow);
});
$('#btnSkip').addEventListener('click', function () { finishIntro(false); });
$('#btnLetter').addEventListener('click', function () { Sound.play('tap'); playIntro(introContext(today())); });

/* 点拍立得：放大看整张合照 */
var photoBox = $('#photoBox');
polaroid.addEventListener('click', function () {
  if (phBox.classList.contains('is-empty') || !polaroid.classList.contains('is-in')) return;
  $('#photoBig').setAttribute('src', photoEl.getAttribute('src'));
  photoBox.classList.add('is-open'); photoBox.setAttribute('aria-hidden', 'false');
  Sound.play('pop');
  pushLayer(function () { photoBox.classList.remove('is-open'); photoBox.setAttribute('aria-hidden', 'true'); });
});
photoBox.addEventListener('click', popLayer);

/* ================= 静音按钮（记住她的选择） ================= */
var btnMute = $('#btnMute');
function syncMute() {
  var m = Sound.isMuted();
  $('#muteIcon').setAttribute('href', m ? '#i-mute' : '#i-sound');
  btnMute.setAttribute('aria-label', m ? '打开声音' : '关闭声音');
  btnMute.setAttribute('aria-pressed', m ? 'true' : 'false');
}
btnMute.addEventListener('click', function () {
  Sound.setMuted(!Sound.isMuted());
  syncMute();
  if (!Sound.isMuted()) Sound.play('pop');
});

/* ================= 添加到主屏幕 ================= */
function setupPWA() {
  var title = C.appTitle || document.title;
  document.title = title;
  var at = $('meta[name="apple-mobile-web-app-title"]'); if (at) at.setAttribute('content', title);
  var an = $('meta[name="application-name"]'); if (an) an.setAttribute('content', title);
  var iconLink = $('link[rel="apple-touch-icon"]'), icon = iconLink ? iconLink.getAttribute('href') : '';
  if (icon) {
    var fav = document.createElement('link'); fav.rel = 'icon'; fav.type = 'image/png'; fav.href = icon;
    document.head.appendChild(fav);
  }
  if (!/^https?:$/.test(location.protocol) || !icon) return;   // manifest 只有放到网上之后才有意义
  try {
    var url = location.origin + location.pathname;
    var manifest = {
      name: title, short_name: title, lang: 'zh-CN',
      start_url: url, scope: url.replace(/[^\/]*$/, ''),
      display: 'standalone', orientation: 'portrait',
      background_color: '#7b64d4', theme_color: '#7b64d4',
      icons: [
        { src: icon, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: icon, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  } catch (e) {}
}

/* ================= 启动 ================= */
function boot() {
  setVh();
  setupPWA();
  syncMute();
  document.documentElement.style.setProperty('--photo-pos', C.photoPosition || '50% 30%');
  catBox.setAttribute('aria-label', '摸摸' + C.catName);
  if (Clock.simLabel) { var sim = $('#sim'); sim.hidden = false; sim.textContent = '测试 ' + Clock.simLabel; }

  renderHome();
  var n = today(), seen = Store.get('introSeen', {}) || {};
  var first = !Store.get('visited', false);
  var replay = Q.has('replay') && Q.get('replay') !== '0';
  if (replay || first || (milestoneOn(n) && !seen[D.str(n)])) playIntro(introContext(n));
  else enterHome(true);

  setInterval(tick, 1000);
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      setVh(); fitHome();
      if (viewer.classList.contains('is-open') && view.cur >= 0) vTrack.scrollLeft = view.cur * vTrack.clientWidth;
    }, 120);
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
}
boot();

})();
</script>
